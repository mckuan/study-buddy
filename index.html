<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .frame {
      width: 420px;
      height: 280px;
      background: rgba(0, 0, 0, 0.01);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
      position: absolute;
    }

    .buttons-exit {
      position: absolute;
      top: 5px;
      left: 8px;
      display: flex;
      gap: 5px;
      z-index: 2; 
    }

    .close-btn, .minimize-btn {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(0,0,0,0.01);
      padding: 0;
    }

    .close-btn { background: rgba(0, 0, 0, 0.01); }
    .minimize-btn { background: rgba(0, 0, 0, 0.01); }

    .content{
      width: 400px;
      height: 250px;
      border-radius: 10px;  
      background: white;
      z-index: 1;
      position: absolute; 
      top: 20px; 
      left: 10px;
      -webkit-app-region: drag; 
    }

    .checklist-btn {
      width: 60px;
      height: 30px;
      top: 10px;
      right: 10px;
      border-radius: 10px;
      background: rgb(251, 196, 77);
      border: none;
      cursor: pointer;
      position: absolute;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.215);
    }

    body {
      margin: 0;
      padding: 0;
      width: 420px;
      height: 280px;
      user-select: none;   
    }

    
  </style>
</head>
<body>
  <div class="frame">
    <div class="buttons-exit">
      <button class="close-btn">x</button>
      <button class="minimize-btn">-</button>
    </div>
    <div class="content">
      <button class = "checklist-btn">checklist</button>
    </div>
  </div>
  <script src="render.js"></script>  
</body>
</html>
