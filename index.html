<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .frame {
      width: 420px;
      height: 280px;
      background: rgba(0, 0, 0, 0.01);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
      position: absolute;
    }

    .buttons-exit {
      position: absolute;
      top: 5px;
      left: 8px;
      display: flex;
      gap: 5px;
      z-index: 2; 
    }

    .close-btn, .minimize-btn, .settings-close {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(0,0,0,0.01);
      padding: 0;
    }

    .close-btn { background: rgba(0, 0, 0, 0.01); }
    .minimize-btn { background: rgba(0, 0, 0, 0.01); }

    .content{
      width: 400px;
      height: 250px;
      border-radius: 10px;  
      background-image: url('main-background.png');
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      z-index: 1;
      position: absolute; 
      top: 20px; 
      left: 10px;
      -webkit-app-region: drag; 
    }

    .error-popup {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 80, 80, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      display: none;
      z-index: 20;
    }

    .blur{
      width: 400px;
      height: 250px;
      border-radius: 10px;  
      background-color: rgba(255, 255, 255, 0.319);
      z-index: 5;
      position: absolute; 
      display: none;
      -webkit-app-region: no-drag; 
    }

    .buttons {
      display: flex;
      gap: 20px;
      position: absolute;
      top: 15px;
      right: 10px;
      z-index: 2;
    }

    .invite-btn, .timer-btn, .checklist-btn {
      width: 60px;
      height: 30px;
      border-radius: 10px;
      background: #eda3a3;
      border: none;
      cursor: pointer;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.651);
    }

    .timer-content {
      position: absolute;
      width: 120px;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #eda3a3d7;
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      color: #333;
      flex-wrap: wrap;
      display: none;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
    }

    .timer-display {
      width: 80px;
      text-align: center;
    }

    .increment-btn, .decrement-btn, .pause-btn ,.stop-btn{
      width: 20px;
      height: 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(0, 0, 0, 0.2);
      right: 60px;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
    }

    .decrement-btn {
      right: 20px;
    }

    .start-btn {
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 5px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .pause-btn{
      right: 60px;
      display: none;
    }

    .stop-btn{
      right: 20px;
      display: none;
    }


    .settings-btn {
      width: 30px;
      height: 30px;
      top: 55px;
      right: 10px;
      border-radius: 50%;
      border: none;
      background: #eda3a3;
      font-size: 18px;
      position: absolute;
      -webkit-app-region: no-drag;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.651);
      cursor: pointer;
    }

    .settings {
      width: 220px;
      height: 220px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 15px;
      border: none;
      background: rgb(255, 255, 255);
      position: absolute;
      -webkit-app-region: no-drag;
      display: none;
      z-index: 10;
      cursor: pointer;
    }
    
    .blur-settings {
      width: 220px;
      height: 220px;
      z-index:15;
      border-radius: 15px;
      position: absolute;
      background-color: rgba(255, 255, 255, 0.516);
      display: none;
    }

    .settings-close{
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #eda3a3;
      z-index: 17;
      color: black;
    }

    .heading{
      position: absolute;
      left: 50%;
      top: 30px;
      transform: translate(-50%, -50%);
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      -webkit-app-region: no-drag;
    }

    .toggle {
      position: absolute;
      top: 55px;
      left: 20px;
      display: inline-block;
      width: 30px;
      height: 15px;
      -webkit-app-region: no-drag;
    }

    .toggle-input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;

      background: #ccc;
      border-radius: 34px;

      transition: 0.2s;
      -webkit-app-region: no-drag;
    }

    .slider::before {
      content: '';

      position: absolute;
      width: 13px;
      height: 13px;

      left: 1px;
      top: 1px;

      background: white;
      border-radius: 50%;

      transition: 0.2s;
    }

    .toggle-input:checked + .slider {
      background: #eda3a3;
    }

    .toggle-input:checked + .slider::before {
      transform: translateX(15px);
    }

    .toggle-instructions{
      position: absolute;
      top: 50px;
      left: 60px;
      overflow-y: auto;
      width: 150px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
    }

    .dropdown-button, .dropdown{
      position: absolute;
      width: 170px;
      left: 20px;
      top: 100px;
      border: 1px solid #eda3a3;
      border-radius: 5px;
      background-color: transparent;
      text-align: left;
      font-family: 'Nunito', sans-serif;
      -webkit-app-region: no-drag;
    }

    .dropdown {
      top: 125px;
      flex-direction: column;
      display: none;
      max-height: 70px;
      border: transparent;
      border-radius: none;
      overflow-y: auto;
    }

    .site-item {
      display: flex;
      align-items: center;
      width: 80%;
      font-size: 12px;
      padding: 2px 0;
    }

    .sites{
      position: relative;
      top: 5px;
      width: 100%;
      left : 0;
      text-align: left;
      align-items: center;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    .delete-btn {
      position: relative;
      flex-shrink: 0;
      background: none;
      border: none;
      margin-left: auto;
      color: #eda3a3;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Nunito', sans-serif;
      -webkit-app-region: no-drag;
      padding: 0;
    }


    .input-text{
      position: relative;
      -webkit-app-region: no-drag;
      left: 5px;
      width: 140px;
      text-align: left;
      font-size: 10px;
      padding: 4px;
      margin-top: 10px;
    }

    .invite-content{
      display: none;
      gap: 10px;
    }

    .invitation-block, .creation-block{
      position: relative;
      border-radius: 10px;
      width: 80px;
      height: 100px;
      top: 50px;
      left: 115px;
      background-color: #eda3a3d7;;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.808);
      -webkit-app-region: no-drag;
    }

    .enter-code, .create-invite{
      position: relative;
      width: 80%;
      top: 20px;
      left: 4px;
    }

    .invite-instructions, .create-instructions{
      position: relative;
      top: 25px;
      left: 4px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
    }

    .create-invite{
      top: 10px;
      left: 50%;
      transform: translate(-50%);
      border-radius: 5px;
      background-color: #eda3a3;
      width: 30px;
      height: 30px;
      display:flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: rgba(71, 36, 36, 0.676);
      border-color: rgba(71, 36, 36, 0.676);;
    }

    .create-instructions{
      top: 15px;
    }

    

    body {
      margin: 0;
      padding: 0;
      width: 420px;
      height: 280px;
      user-select: none;   
    }

    
  </style>
</head>
<body>
  <div class="frame">
    <div class="buttons-exit">
      <button class="close-btn">x</button>
      <button class="minimize-btn">-</button>
    </div>
    <div class="content">
      <div class="error-popup">Incorrect password</div>
      <div class="blur" ></div>
      <div class="buttons">
        <button class = "invite-btn">invite</button>
        <button class = "timer-btn">timer</button>
        <button class = "checklist-btn">checklist</button>
      </div>
      <div class = "invite-content">
        <div class = "invitation-block">
           <input class ="enter-code" placeholder = "ABC123"/>
           <div class="invite-instructions">Enter code from friend!</div>
        </div>
        <div class = "creation-block">
          <button class="create-invite">＋</button>
          <div class = "create-instructions" >Create a study room!</div>
        </div>
      </div>
      <div class="timer-content">
        <button class="pause-btn">⏯</button>
        <button class = "increment-btn">+</button>
        <div class="timer-display"></div>
        <button class = "decrement-btn">-</button>
        <button class="stop-btn">⏹</button>
        <button class="start-btn">start</button>
      </div>
      <button class="settings-btn">⚙</button>
      <div class="settings">  
        <div class="blur-settings"></div>
        <button class="settings-close">x</button>
        <div class="heading">Settings</div>
        <label class="toggle">
          <input type="checkbox" class="toggle-input">
          <span class="slider"></span>
        </label>
        <div class="toggle-instructions">Allow Studybuddy to block certain websites</div>
        <button class="dropdown-button">  Blocked Sites ▾</button>
        <div class="dropdown">
          <div class="sites"></div>
          <input class="input-text" placeholder="Domain name ex: youtube.com"/>
        </div>
      </div>
    </div>
  </div>
  <script src="render.js"></script>  
</body>
</html>
