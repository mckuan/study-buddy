<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    .frame {
      width: 420px;
      height: 280px;
      background: rgba(0, 0, 0, 0.01);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
      position: absolute;
    }

    .buttons-exit {
      position: absolute;
      top: 5px;
      left: 8px;
      display: flex;
      gap: 5px;
      z-index: 2; 
    }

    .close-btn, .minimize-btn, .settings-close {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: rgba(0,0,0,0.01);
      padding: 0;
    }

    .close-btn { background: rgba(0, 0, 0, 0.01); }
    .minimize-btn { background: rgba(0, 0, 0, 0.01); }

    .content{
      width: 400px;
      height: 250px;
      border-radius: 10px;  
      background-image: url('cozy-room2.png');
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      z-index: 1;
      position: absolute; 
      top: 20px; 
      left: 10px;
      -webkit-app-region: drag; 
    }

    .blur{
      width: 400px;
      height: 250px;
      border-radius: 10px;  
      background-color: rgba(255, 255, 255, 0.319);
      border-radius: 10px;
      z-index: 5;
      position: absolute; 
      display: none;
      -webkit-app-region: no-drag; 
    }

    .buttons {
      display: flex;
      gap: 20px;
      position: absolute;
      top: 15px;
      right: 10px;
      z-index: 2;
    }

    .invite-btn, .timer-btn, .checklist-btn {
      width: 60px;
      height: 30px;
      border-radius: 10px;
      background: rgb(244, 217, 157);
      border: none;
      cursor: pointer;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.651);
    }

    .timer-content {
      position: absolute;
      width: 120px;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(247, 120, 201, 0.8);
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      color: #333;
      flex-wrap: wrap;
      display: none;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
    }

    .timer-display {
      width: 80px;
      text-align: center;
    }

    .increment-btn {
      width: 20px;
      right: 60px;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
    }

    .decrement-btn {
      width: 20px;
      right: 20px;
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
    }

    .start-btn {
      -webkit-app-region: no-drag;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .settings-btn {
      width: 30px;
      height: 30px;
      top: 55px;
      right: 10px;
      border-radius: 50%;
      border: none;
      background: rgb(244, 217, 157);
      font-size: 18px;
      position: absolute;
      -webkit-app-region: no-drag;
      cursor: pointer;
    }

    .settings {
      width: 220px;
      height: 220px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 15px;
      border: none;
      background: white;
      position: absolute;
      -webkit-app-region: no-drag;
      display: none;
      z-index: 10;
      cursor: pointer;
    }

    .settings-close{
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: grey;
      color: black;
    }

    body {
      margin: 0;
      padding: 0;
      width: 420px;
      height: 280px;
      user-select: none;   
    }

    
  </style>
</head>
<body>
  <div class="frame">
    <div class="buttons-exit">
      <button class="close-btn">x</button>
      <button class="minimize-btn">-</button>
    </div>
    <div class="content">
      <div class="blur" ></div>
      <div class="buttons">
        <button class = "invite-btn">invite</button>
        <button class = "timer-btn">timer</button>
        <button class = "checklist-btn">checklist</button>
      </div>
      <div class="timer-content">
        <button class = "increment-btn">+</button>
        <div class="timer-display"></div>
        <button class = "decrement-btn">-</button>
        <button class="start-btn">start</button>
      </div>
      <button class="settings-btn">⚙</button>
      <div class="settings">  
        <button class="settings-close">x</button>
      </div>
    </div>
  </div>
  <script src="render.js"></script>  
</body>
</html>
