<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/invite.css">
  <link rel="stylesheet" href="css/cat.css">
  <link rel="stylesheet" href="css/select.css">
</head>
<body>
  <div class="frame">
    <div class="buttons-exit">
      <button class="close-btn">x</button>
      <button class="minimize-btn">-</button>
    </div>
    <div class="content">
      <div class="blur"></div>
      <div class="collar"></div>
      <div class="buttons">
        <button class="invite-btn">invite</button>
        <button class="timer-btn">timer</button>
        <button class="checklist-btn">checklist</button>
      </div>
      <div class="skin-selector" id="skin-selector">
        <div class="select-welcome">
          <h2>welcome to study-buddy!</h2>
          <input id="player-name" placeholder="what's your name?" maxlength="20" />
        </div>

        <div class="selectors">
          <div class="cat-select">
            <p class="select-label">choose your cat</p>
            <div class="skin-row">
              <button id="skin-prev">◀</button>
              <div class="cat-preview">
                <img id="skin-name" src="" alt="cat preview" />
                <div class="collarE"></div>
              </div>
              <button id="skin-next">▶</button>
            </div>
            <span id="skin-idx"></span>
          </div>
          <div class="collar-select">
            <p class="select-label">choose your collar color</p>
            <div class="collar-row">
              <button id="collar-prev">◀</button>
              <div class="collar-swatches" id="collar-swatches"></div>
              <button id="collar-next">▶</button>
            </div>
            <span id="collar-page-idx"></span>
          </div>
        </div>
        <button id="skin-go">let's go</button>
      </div>
      
      <div class="invite-content">
        <div class="invitation-block">
          <input class="enter-code" placeholder="ABC123"/>
          <div class="invite-instructions">Enter code from friend!</div>
        </div>
        <div class="creation-block">
          <button class="create-invite">＋</button>
          <div class="create-instructions">Create a study room!</div>
        </div>
      </div>
      <div class="timer-content">
        <button class="pause-btn">⏸</button>
        <button class="increment-btn">+</button>
        <div class="timer-display"></div>
        <button class="decrement-btn">-</button>
        <button class="stop-btn">⏹</button>
        <button class="start-btn">start</button>
      </div>
      <button class="settings-btn">⚙</button>
      <div class="settings">
        <div class="blur-settings"></div>
        <button class="settings-close">x</button>
        <div class="heading">Settings</div>
        <div class="error-popup">Incorrect password</div>
        <div class="toggles">
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" class="toggle-input" id="always-on-top">
              <span class="slider"></span>
            </label>
            <div class="toggle-instructions">Always show Studybuddy</div>
          </div>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" class="toggle-input" id="allow-blocking">
              <span class="slider"></span>
            </label>
            <div class="toggle-instructions">Allow Studybuddy to block certain websites</div>
          </div>
        </div>
        <button class="dropdown-button">Blocked Sites ▾</button>
        <div class="dropdown">
          <div class="sites"></div>
          <input class="input-text" placeholder="Domain name ex: youtube.com"/>
        </div>
      </div>
    </div>
  </div>
  <script src="js/cat/idle.js"></script>
  <script src="js/cat/play.js"></script>
  <script src="js/cat/sleep1.js"></script>
  <script src="js/cat/sleep2.js"></script>
  <script src="js/cat/eat.js"></script>
  <script src="js/cat/poop.js"></script>
  <script src="js/cat/cat.js"></script>
  <script src="js/render.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/invite.js"></script>
  <script src="js/select.js"></script>
</body>
</html>
