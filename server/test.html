<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <input id="name" placeholder="your name">
  <button onclick="createRoom()">Create Room</button>
  <br><br>
  <input id="code" placeholder="room code">
  <button onclick="joinRoom()">Join Room</button>
  <br><br>
  <input id="msg" placeholder="message">
  <button onclick="sendMessage()">Send</button>
  <br><br>
  <div id="log"></div>

  <script>
    const socket = io('http://localhost:3000');
    let currentCode = null;

    function log(text) {
      document.getElementById('log').innerHTML += `<p>${text}</p>`;
    }

    socket.on('room-created', ({ code }) => {
      currentCode = code;
      log(`✅ room created: ${code}`);
    });

    socket.on('room-joined', ({ code, members, messages }) => {
      currentCode = code;
      log(`✅ joined room: ${code}`);
      log(`members: ${members.map(m => m.name).join(', ')}`);
    });

    socket.on('member-joined', ({ name }) => log(`👤 ${name} joined`));
    socket.on('member-left', ({ name }) => log(`👋 ${name} left`));
    socket.on('new-message', ({ name, text }) => log(`💬 ${name}: ${text}`));
    socket.on('error', ({ message }) => log(`❌ ${message}`));

    function createRoom() {
      const name = document.getElementById('name').value;
      socket.emit('create-room', { name });
    }

    function joinRoom() {
      const name = document.getElementById('name').value;
      const code = document.getElementById('code').value;
      socket.emit('join-room', { code, name });
    }

    function sendMessage() {
      const text = document.getElementById('msg').value;
      socket.emit('send-message', { code: currentCode, name: document.getElementById('name').value, text });
    }
  </script>
</body>
</html>
