<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/room.css">
</head>
<body>
  <div class="room-frame">
    <div class="room-code"></div>
    <div class="members-list" style="display:none"></div>
    <div class="buttons">
      <div class="leaderboard-row">
        <button class="focus-mode">⏾</button>
        <button class="leaderboard">leaderboard</button>
      </div>  
      <button class="chat-btn">chat</button>   
      <button class="leave-btn">leave</button>
    </div>
    <div class="chat">  
      <div class="chat-messages"></div>
      <div class="chat-input-row">
        <input class="chat-input" placeholder="say something...">
      </div>
    </div>
    <div class="leaderboard-content">
      <div class="ranking"></div>
    </div>
  </div>
  <script src="js/room.js"></script>
</body>
</html>
