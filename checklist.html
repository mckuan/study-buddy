<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>

    .checklist-frame {
      width: 250px;
      height: 200px;
      background: white;        
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
      font-family: 'Nunito', sans-serif;
      padding: 16px;
      -webkit-app-region: drag;
    }

    .input-text {
      width: 240px;
      padding: 4px;
      margin-bottom: 12px;
      border: transparent;
      font-family: 'Nunito', sans-serif;
      border-radius: 4px;
      font-size: 14px;
      -webkit-app-region: no-drag;
    }

    .checklist-items {
      width: 230px;
      max-height: 150px;
      overflow-y: scroll;
      align-Items: center ;
      -webkit-app-region: no-drag;
    }



    body {
      margin: 0;
      width: 250px;
      height: 200px;
      background: transparent;
      overflow: hidden;
    }
   
  </style>
</head>
<body>
  <div class="checklist-frame">
    <input class="input-text" placeholder="Add new item">
    <div class="checklist-items"></div>
  </div>
  <script src="checklist-render.js"></script>
</body>
</html>
